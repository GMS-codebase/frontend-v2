name: Deploy Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Set environment variables based on the branch (Main or Staging)
      - name: Set Environment Variables
        run: |
            echo "Main branch detected"
            chmod +x ./scripts/create_dev_env.sh
            bash ./scripts/create_dev_env.sh
            export FRONTEND_DIR=frontend-v2
            export PORT=5600

      # Verify Current Directory
      - name: Verify Current Directory
        run: |
          echo "Current Directory: $(pwd)"
          ls -la
          if [ ! -d ".git" ]; then
            echo "No .git directory found. This is unexpected."
          fi

      # Verify Git Status
      - name: Verify Git Status
        run: |
          git status

      # Install dependencies and build the application
      - name: Install dependencies and build the application
        run: |
          git pull origin main
          npm install --force
          npm run build

      - name: Create the jobs names
        run: |
            echo "Main branch detected"
            export JOB_NAME="gms-frontend"
            export SCRIPT_NAME="development"
          echo "JOB_NAME=$JOB_NAME"
          echo "SCRIPT_NAME=$SCRIPT_NAME"

      # Start the application using pm2
      - name: Start the application using pm2
        run: |
            echo "Main branch detected"
          pm2 restart gms-frontend
          pm2 save
