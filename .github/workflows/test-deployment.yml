name: Deploy To Testing Server

on:
  push:
    branches:
      - staging 

jobs:
  deploy:
    runs-on: self-hosted 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          check-latest: true
          cache: "npm"
      
      - name: Install dependencies
        run: npm install --force

      - name: Create environment variables
        run: |
          chmod +x scripts/create_staging_env.sh
          ./scripts/create_staging_env.sh

      - name: Build Next.js app
        run: npm run build

      - name: Deploy Application
        run: |
          cd ~/apps/staging/frontend-v2-staging
          git stash
          git pull origin staging 
          npm install --force
          npm run build
          pm2 restart gms-staging
          pm2 save
