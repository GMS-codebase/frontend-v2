name: Deploy To Testing Server

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          check-latest: true
          cache: "npm"
      - name: Install dependencies
        run: npm install --force

      - name: Create environment variables
        run: |
          chmod +x scripts/create_test_env.sh
          ./scripts/create_staging_env.sh

      - name: Build Next.js app
        run: npm run build

      - name: Deploy to SSH server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: 197.243.23.139
          port: 22
          username: gmsuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/apps/frontend-v2
            git stash
            git pull origin main
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            npm  install --force
            npm  run build
            pm2 restart frontend-v2
            pm2 save
