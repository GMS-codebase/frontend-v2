name: Deploy To Testing Server

on:
  push:
    branches:
      - staging   

jobs:
  deploy:
    runs-on: self-hosted   

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install dependencies
        run: npm install --force

      - name: Create environment variables
        run: |
          chmod +x scripts/create_staging_env.sh
          ./scripts/create_staging_env.sh

      - name: Build Next.js app
        run: npm run build

      - name: Deploy to SSH server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: 197.243.23.139
          port: 22
          username: gmsuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/apps/frontend-v2/staging/frontend-v2-staging
            git stash
            git pull origin staging  
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            npm install --force
            npm run build
            pm2 restart gms-staging
            pm2 save
