name: Deploy To Testing Server

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: self-hosted 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create environment variables
        run: |
          chmod +x scripts/create_staging_env.sh
          ./scripts/create_staging_env.sh

      - name: Deploy Application
        run: |
          cd ~/apps/staging/frontend-v2-staging
          git stash
          git pull origin staging 
          npm install --force
          npm run build
          pm2 restart gms-staging
          pm2 save
