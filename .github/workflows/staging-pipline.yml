name: Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          path: staging

      # Set Environment Variables
      - name: Set Environment Variables
        run: |
          echo "Staging branch detected"
          cd staging
          chmod +x ./scripts/create_staging_env.sh
          if [ ! -f ./scripts/create_staging_env.sh ]; then
            echo "Script not found!"; exit 1;
          fi
          bash ./scripts/create_staging_env.sh
          echo "FRONTEND_DIR=frontend-v2-staging" >> $GITHUB_ENV

      # Verify Current Directory
      - name: Verify Current Directory
        run: |
          echo "Current Directory: $(pwd)"
          ls -la ./staging

      # Verify Git Status
      - name: Verify Git Status
        run: |
          cd staging
          git status

      # Cache npm dependencies
      # - name: Cache npm dependencies
      #   uses: actions/cache@v3
      #   with:
      #     path: ~/.npm
      #     key: ${{ runner.os }}-node-${{ hashFiles('staging/package-lock.json', 'staging/yarn.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-node-

      # Install dependencies and build the application
      - name: Install dependencies and build the application
        run: |
          cd staging
          pnpm install --force
          pnpm run build

      - name: Mode .next, package.json, node_modules folder to builds folder
        run: |
          cd staging
          cp -r .next ~/frontend-actions-runner/_work/frontend-v2/frontend-v2/builds/staging/
          cp -r package.json ~/frontend-actions-runner/_work/frontend-v2/frontend-v2/builds/staging/
          cp -r node_modules ~/frontend-actions-runner/_work/frontend-v2/frontend-v2/builds/staging/

      # Start the application using pm2
      - name: Start the application using pm2
        run: |
          cd staging
          cd ~/frontend-actions-runner/_work/frontend-v2/frontend-v2/builds/staging/
          pm2 restart gms-staging || pm2 start ecosystem.config.js --env .env.local
          pm2 save
